          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt GetOrderLogs.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecretArn
        # Equivalente a la plantilla SAM DynamoDBReadPolicy (TableName: !Ref NexoTable).
        - PolicyName: DynamoDBReadPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ["dynamodb:GetItem","dynamodb:Scan","dynamodb:Query","dynamodb:BatchGetItem","dynamodb:DescribeTable","dynamodb:TransactGetItems"]
                Resource:
                  - !GetAtt NexoTable.Arn
                  - !Sub ${NexoTable.Arn}/index/*
  GetOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-get-order
      CodeUri: ../../dist/functions/get-order.zip
      MemorySize: 1024
      Role: !GetAtt GetOrderRole.Arn
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref GetOrderLogs
      Events:
        Route0:
          Type: HttpApi
          Properties:
            ApiId: !Ref StoreApi
            Method: GET
            Path: /api/v1/orders/{id}
            PayloadFormatVersion: '2.0'
            TimeoutInMillis: 29000
Outputs:
  ApiUrl:
    Value: !Sub https://${StoreApi}.execute-api.${AWS::Region}.amazonaws.com/lab
  StoreUrl:
    Value: !Sub https://${StoreDistribution.DomainName}
  FrontendBucketName:
    Value: !Ref FrontendBucket
  DistributionId:
    Value: !Ref StoreDistribution

